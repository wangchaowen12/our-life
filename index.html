<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ════════════════════════════════════════════════════════
   ★ 設定區：貼上你的 Google Apps Script 網址
════════════════════════════════════════════════════════ */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwWF7d8VAbj1XhijdKRc8d8eLPwMhdikWxqw5Il4ocRJ_D27IFH5VPmTfjYODdvUXoj/exec';
const IS_CONFIGURED = APPS_SCRIPT_URL !== 'YOUR_APPS_SCRIPT_URL_HERE';
const IS_FILE_PROTOCOL = (typeof window!=='undefined') && window.location.protocol === 'file:';
// LINE / Facebook / Instagram / WeChat's built-in browsers are separate WebView environments that
// can restrict cross-origin requests or behave inconsistently with cloud sync — recommend opening
// in the real system browser (Safari/Chrome) instead.
const IN_APP_BROWSER = (typeof navigator!=='undefined') && /Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent);

/* ════════════════════════════════════════════════════════
   Google Sheets / Drive API
════════════════════════════════════════════════════════ */
async function apiGet(params) {
  const url = new URL(APPS_SCRIPT_URL);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  // Cache-bust: some embedded browsers (e.g. LINE/FB in-app WebViews) aggressively cache GET
  // responses even for dynamic data. A unique query param + no-store guarantees a fresh network hit.
  url.searchParams.set('_ts', Date.now().toString());
  const res = await fetch(url.toString(), { redirect: 'follow', cache: 'no-store' });
  return JSON.parse(await res.text());
}
async function apiPost(body) {
  const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(body), redirect: 'follow', cache: 'no-store' });
  return JSON.parse(await res.text());
}
async function sheetsLoadAll() {
  const r = await apiGet({ action: 'getData' });
  if (r.ok) return r.data;
  throw new Error(r.error || '讀取失敗');
}
async function sheetsSave(key, value) {
  await apiPost({ action: 'saveData', key, value });
}
async function driveUploadImage(dataUrl) {
  const [header, base64] = dataUrl.split(',');
  const mimeType = header.match(/:(.*?);/)[1];
  const filename  = 'node-' + Date.now() + '.' + mimeType.split('/')[1];
  const r = await apiPost({ action: 'uploadImage', filename, base64, mimeType });
  if (r.ok) return r.url;
  throw new Error(r.error || '圖片上傳失敗');
}

/* ════════════════════════════════════════════════════════
   CONSTANTS
════════════════════════════════════════════════════════ */
const APPLE = { key:'apple', name:'蘋果派', color:'#E8956D' };

};

const PAGES = [
  { key:'home',      label:'首頁',  icon:'🏠' },
  { key:'dream',     label:'夢想',  icon:'✦'  },
  { key:'calendar',  label:'月曆',  icon:'📅' },
  { key:'memories',  label:'回憶',  icon:'📸' },
  { key:'review',    label:'回顧',  icon:'📖' },
];
const MONTHS = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const DAYS   = ['日','一','二','三','四','五','六'];

/* ════════════════════════════════════════════════════════
   DATA MIGRATION (old 4-layer → new 3-layer format)
════════════════════════════════════════════════════════ */
function migrateData(raw) {
  // If no data, use defaults
  if (!raw) return buildDefault();
  try {
    // Validate new format: projects must be a flat array
    if (Array.isArray(raw.projects) && raw.dream) {
      return raw; // already correct format, use as-is
    }
    // Old 4-layer format: has 'domains' array — just discard and use defaults
    // (user has confirmed existing data is minimal, so fresh start is fine)
    console.warn('舊版資料格式，已自動重設為預設資料');
    return buildDefault();
  } catch (e) {
    console.error('migrateData error:', e);
    return buildDefault();
  }
}


/* ════════════════════════════════════════════════════════
   LOCAL STORAGE
════════════════════════════════════════════════════════ */
const LS_KEY = 'apple-pine-v2';
function lsLoad() { try { const s=localStorage.getItem(LS_KEY); return s?JSON.parse(s):null; } catch(e){ return null; } }
function lsSave(s) { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch(e){} }

/* ════════════════════════════════════════════════════════
   DATA MODEL
════════════════════════════════════════════════════════ */
function uid() { return Math.random().toString(36).slice(2, 9); }

function makeNode(title, desc='') {
  return { id:uid(), title, desc, image:null, updates:[], _updatedAt: Date.now() };
}
function makeAction(title) {
  return { id:uid(), title, desc:'', image:null, updates:[], status:'todo', assignee:'us', dueDate:null, completedAt:null,
    recurType:'once', recurFreq:'weekly', recurCustomDays:7, subitems:[], _updatedAt: Date.now() };
}
/* ── Action subitems (checklist under an Action, max 4) ──
   Each subitem: { id, title, done, assignee, monthlyFocus }. Free-form, user-created; an Action may have 0–4.
   assignee is 'apple' or 'pine' only (no shared "us" option at this level).
   monthlyFocus: whether this subitem is starred as this month's focus (drives the Home page's 本月執行專案). */
function makeSubitem(title='') {
  return { id:uid(), title, done:false, assignee:'apple', monthlyFocus:false };
}
/* ── Recurring Action helpers ──
   recurType: 'once' | 'recurring'
   recurFreq: 'weekly' | 'monthly' | 'yearly' | 'custom' (only used when recurring)
   recurCustomDays: number of days, only used when recurFreq==='custom' */
function nextRecurDate(fromDateStr, recurFreq, customDays) {
  const d = fromDateStr ? new Date(fromDateStr) : new Date();
  if (recurFreq==='weekly') d.setDate(d.getDate()+7);
  else if (recurFreq==='monthly') d.setMonth(d.getMonth()+1);
  else if (recurFreq==='yearly') d.setFullYear(d.getFullYear()+1);
  else d.setDate(d.getDate()+(parseInt(customDays,10)||7));
  return d.toISOString().slice(0,10);
}
/* Marks a recurring action done: stays as the SAME card, records when it should reopen */
function markActionDone(action) {
  return {
    ...action,
    status: 'done',
    completedAt: todayKey(),
    recurNextDate: action.recurType==='recurring' ? nextRecurDate(todayKey(), action.recurFreq, action.recurCustomDays) : null,
    _updatedAt: Date.now(),
  };
}
/* Marks an action not-done (undo), clearing any pending rollover date */
function markActionUndone(action) {
  return { ...action, status:'todo', completedAt:null, recurNextDate:null, _updatedAt:Date.now() };
}
/* Sweeps every action across every project: any recurring action that's been "done" past its
   recurNextDate automatically reopens as todo (same card, same id — no duplicates). Keeps the
   last completion date under lastCompletedAt so history isn't lost. Returns the SAME demData
   reference untouched if nothing needs to roll over, so it never triggers pointless re-renders/saves. */
function rolloverDueActions(demData) {
  if (!demData || !demData.actions) return demData;
  const today = todayKey();
  let changed = false;
  const actions = {};
  Object.keys(demData.actions).forEach(pid => {
    const list = demData.actions[pid] || [];
    const newList = list.map(a => {
      if (a && a.status==='done' && a.recurType==='recurring' && a.recurNextDate && a.recurNextDate <= today) {
        changed = true;
        return { ...a, status:'todo', lastCompletedAt:a.completedAt||a.lastCompletedAt||null, completedAt:null, recurNextDate:null, _updatedAt:Date.now() };
      }
      return a;
    });
    actions[pid] = newList;
  });
  return changed ? { ...demData, actions } : demData;
}

function buildDefault() {
  // 3-layer: Dream → Project → Action
  // Projects replace both old Domains and sub-Projects
  const projectDefs = [
    { title:'IRC 內在真實練習圈', owner:'apple' },
    { title:'森林療癒',           owner:'pine'  },
    { title:'身心健康',           owner:'us'    },
    { title:'關係經營',           owner:'us'    },
    { title:'學習成長',           owner:'us'    },
    { title:'財務工作',           owner:'us'    },
    { title:'旅行探索',           owner:'us'    },
    { title:'家與生活空間',       owner:'us'    },
  ];
  const projects = projectDefs.map(({ title, owner }) => ({ ...makeNode(title), owner, status:'todo' }));
  const [irc,forest,health,relation,learning,finance,travel,home] = projects;
  const actions = {
    [irc.id]:      ['品牌建立','IRC 網站','年度盛會','SOF研究','引導員培育','課程設計','身體覺察','社群經營'].map(t=>makeAction(t)),
    [forest.id]:   ['森林工作坊','自然教育','森林探勘','森林旅行','合作夥伴','裝備','品牌建立','森林課程'].map(t=>makeAction(t)),
    [health.id]:   ['空中瑜伽','Feldenkrais','運動','睡眠','飲食','身體保養','情緒照顧','休息'].map(t=>makeAction(t)),
    [relation.id]: ['深度對話','約會','共同決策','衝突修復','傾聽','陪伴','家庭','朋友'].map(t=>makeAction(t)),
    [learning.id]: ['閱讀','課程','研究','寫作','海外學習','反思','創作','AI工具'].map(t=>makeAction(t)),
    [finance.id]:  ['收入','投資','儲蓄','工作安排','事業規劃','共同預算','保險','退休規劃'].map(t=>makeAction(t)),
    [travel.id]:   ['京都','大阪','森林旅行','淡蘭古道','海外旅行','文化探索','攝影','自由旅行'].map(t=>makeAction(t)),
    [home.id]:     ['整理收納','工作室','生活儀式','居住品質','家具','植物','居家修繕','共同空間'].map(t=>makeAction(t)),
  };
  return { dream:makeNode('共創理想生活'), projects, actions };
}

function buildDefaultState() {
  return { demData:buildDefault(), calEvents:[], todayStatus:{ apple:{stress:'normal',note:''}, pine:{stress:'normal',note:''} }, support:{} };
}

/* ════════════════════════════════════════════════════════
   MERGE-ON-SYNC — reconciling edits made on two different devices
   ────────────────────────────────────────────────────────
   Google Sheets isn't a real-time database, so instead of one device's save blindly
   overwriting whatever the other device wrote, we fetch the latest cloud copy right
   before writing and merge item-by-item (matched by id), keeping whichever version of
   each item has the newer _updatedAt timestamp, and unioning items that only exist on
   one side. This means two people editing DIFFERENT items on separate devices both
   keep their work, instead of whoever hits save second wiping out the other's changes.

   DELETIONS need special handling: a plain id-union merge can't tell "the cloud doesn't
   know about this new item yet" apart from "this item used to exist and was deleted" —
   both just look like "missing from one side". So whenever something is deleted locally,
   its id goes into pendingDeleteIds for the rest of this session; the merge then actively
   excludes that id even if a (stale) cloud copy still has it, instead of quietly reviving it. */
const pendingDeleteIds = new Set();
function markDeletedForSync(...ids) { ids.forEach(id => id && pendingDeleteIds.add(id)); }

function mergeById(cloudList, localList) {
  const cloudArr = Array.isArray(cloudList) ? cloudList : [];
  const localArr = Array.isArray(localList) ? localList : [];
  const map = new Map();
  cloudArr.forEach(item => { if (item && item.id && !pendingDeleteIds.has(item.id)) map.set(item.id, item); });
  localArr.forEach(item => {
    if (!item || !item.id || pendingDeleteIds.has(item.id)) return;
    const existing = map.get(item.id);
    if (!existing) { map.set(item.id, item); return; }
    const localT = item._updatedAt || 0, cloudT = existing._updatedAt || 0;
    map.set(item.id, localT >= cloudT ? item : existing);
  });
  return Array.from(map.values());
}
function mergeStringArray(cloudArr, localArr) {
  const seen = new Set();
  const out = [];
  [...(cloudArr||[]), ...(localArr||[])].forEach(s => { if (s && !seen.has(s)) { seen.add(s); out.push(s); } });
  return out;
}
function mergeUpdatesArray(cloudArr, localArr) {
  const key = u => `${u && u.date}::${u && u.text}`;
  const map = new Map();
  [...(cloudArr||[]), ...(localArr||[])].forEach(u => { if (u) map.set(key(u), u); });
  return Array.from(map.values()).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
}
/* mergeById gets the CONTENT right (which item wins per id) but not ORDER — a plain union
   always comes out in "cloud order, then any local-only extras appended", so a drag-reorder
   done locally would get silently undone by the very next sync. To fix that, every reorderable
   list is paired with an "OrderAt" timestamp (bumped only when the list is actually reordered,
   never when an item's content is edited) — whichever side reordered more recently determines
   the sequence used for the merged result; any item not part of that sequence (newly added
   elsewhere) is appended at the end. */
function mergeOrderedById(cloudList, localList, cloudOrderAt, localOrderAt) {
  const idMerged = mergeById(cloudList, localList);
  const useLocalOrder = (localOrderAt||0) >= (cloudOrderAt||0);
  const baseArr = useLocalOrder ? (Array.isArray(localList)?localList:[]) : (Array.isArray(cloudList)?cloudList:[]);
  const byId = new Map(idMerged.map(it => [it.id, it]));
  const ordered = [];
  const seen = new Set();
  baseArr.forEach(it => { if (it && byId.has(it.id) && !seen.has(it.id)) { ordered.push(byId.get(it.id)); seen.add(it.id); } });
  idMerged.forEach(it => { if (!seen.has(it.id)) { ordered.push(it); seen.add(it.id); } });
  return ordered;
}
function mergeDemData(cloudDem, localDem) {
  const cloud = cloudDem || {};
  const local = localDem || buildDefault();
  const projects = mergeOrderedById(cloud.projects, local.projects, cloud.projectsOrderAt, local.projectsOrderAt);
  const pids = new Set([...Object.keys(cloud.actions||{}), ...Object.keys(local.actions||{})]);
  const actions = {};
  const cloudActionsOrderAt = cloud.actionsOrderAt || {};
  const localActionsOrderAt = local.actionsOrderAt || {};
  const actionsOrderAt = {};
  pids.forEach(pid => {
    actions[pid] = mergeOrderedById((cloud.actions||{})[pid], (local.actions||{})[pid], cloudActionsOrderAt[pid], localActionsOrderAt[pid]);
    actionsOrderAt[pid] = Math.max(cloudActionsOrderAt[pid]||0, localActionsOrderAt[pid]||0);
  });
  return {
    dream: local.dream || cloud.dream || makeNode('共創理想生活'),
    projects, actions,
    projectsOrderAt: Math.max(cloud.projectsOrderAt||0, local.projectsOrderAt||0),
    actionsOrderAt,
  };
}
function mergeCalEventsData(cloudEv, localEv) {
  return mergeById(cloudEv, localEv);
}
function mergeTodayStatus(cloudTS, localTS) {
  return { ...(cloudTS||{}), ...(localTS||{}) };
}
function mergeSupport(cloudSup, localSup) {
  const cloud = cloudSup || {};
  const local = localSup || {};
  const ids = new Set([...Object.keys(cloud), ...Object.keys(local)]);
  const merged = {};
  ids.forEach(id => {
    const c = cloud[id] || { needed:[], received:[] };
    const l = local[id] || { needed:[], received:[] };
    merged[id] = { needed: mergeStringArray(c.needed, l.needed), received: mergeStringArray(c.received, l.received) };
  });
  return merged;
}

/* ════════════════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════════════════ */
function todayKey() {
  const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayLabel() {
  const d=new Date(), wd=['日','一','二','三','四','五','六'];
  return `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日 · 星期${wd[d.getDay()]}`;
}
function toKey(y,m,d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
/* Multi-day event helpers — supports old {date} format and new {startDate,endDate} format */
function eventStart(e) { return e.startDate || e.date; }
function eventEnd(e)   { return e.endDate || e.startDate || e.date; }
function eventSpansDay(e, day) { const s=eventStart(e), en=eventEnd(e); return !!s && day>=s && day<=en; }
function eventOverlapsRange(e, rangeStart, rangeEnd) {
  const s=eventStart(e), en=eventEnd(e);
  if (!s) return false;
  return en>=rangeStart && s<=rangeEnd;
}
function migrateCalEvents(events) {
  if (!Array.isArray(events)) return [];
  return events.map(e => ({
    ...e,
    startDate: e.startDate || e.date,
    endDate:   e.endDate   || e.startDate || e.date,
  }));
}
function monthGrid(y,m) {
  const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), cells=[];
  for(let i=0;i<first;i++) cells.push(null);
  for(let d=1;d<=days;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);
  return cells;
}
function orbitPositions(n,rx=38,ry=34) {
  return Array.from({length:n},(_,i)=>{const a=(i/n)*2*Math.PI-Math.PI/2;return{x:50+rx*Math.cos(a),y:50+ry*Math.sin(a)};});
}

/* ════════════════════════════════════════════════════════
   IMAGE UPLOAD FIELD
════════════════════════════════════════════════════════ */
function ImageUploadField({ value, onChange }) {
  const [warning, setWarning] = useState('');
  const [uploading, setUploading] = useState(false);
  const [failed, setFailed] = useState(false);

  useEffect(() => { setFailed(false); }, [value]);

  function handleFile(e) {
    const file = e.target.files&&e.target.files[0]; e.target.value='';
    if (!file) return;
    if (file.size>10*1024*1024) { setWarning('照片超過 10MB，請選小一點的'); return; }
    if (!IS_CONFIGURED) { setWarning('請先設定 Google Apps Script 網址才能上傳照片'); return; }
    setWarning(''); setUploading(true);
    const reader = new FileReader();
    reader.onload = async () => {
      try { const url = await driveUploadImage(reader.result); onChange(url); setFailed(false); }
      catch (err) { setWarning('上傳失敗：' + err.message); }
      finally { setUploading(false); }
    };
    reader.onerror = () => { setWarning('讀取失敗'); setUploading(false); };
    reader.readAsDataURL(file);
  }

  return (
    <div style={{ display:'flex',flexDirection:'column',gap:6 }}>
      <label style={{ display:'block',border:'1.5px dashed #D8D0C4',borderRadius:10,padding:'10px',textAlign:'center',fontSize:12,color:uploading?'#C0B8AE':'#A09688',cursor:uploading?'not-allowed':'pointer',background:uploading?'transparent':'rgba(255,255,255,.5)' }}>
        {uploading ? '上傳至 Google Drive 中...' : '📷 上傳照片'}
        <input type="file" accept="image/*" style={{display:'none'}} onChange={handleFile} disabled={uploading} />
      </label>
      {warning && <p style={{fontSize:11,color:'#C0887A'}}>{warning}</p>}
      {value && (
        <div style={{position:'relative',height:80,borderRadius:10,overflow:'hidden',border:'1px solid #E0D9CF'}}>
          {!failed
            ? <img src={value} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}} onError={()=>setFailed(true)} />
            : <div style={{width:'100%',height:'100%',background:'#F0EDE8',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,color:'#C0B8AE'}}>圖片無法載入</div>}
          <button type="button" onClick={()=>onChange(null)} style={{position:'absolute',top:4,right:4,width:20,height:20,borderRadius:'50%',background:'rgba(255,255,255,.9)',border:'none',fontSize:13,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',lineHeight:1}}>×</button>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════
   VOICE INPUT（語音輸入）
════════════════════════════════════════════════════════ */
const SpeechRecognitionAPI = (typeof window!=='undefined') && (window.SpeechRecognition || window.webkitSpeechRecognition);

function MicButton({ onAppend, lang='zh-TW' }) {
  const [listening, setListening] = useState(false);
  const recRef = useRef(null);

  useEffect(()=>()=>{ try{ recRef.current && recRef.current.stop(); }catch(e){} },[]);

  if (!SpeechRecognitionAPI) return null;

  function toggle(e) {
    e.preventDefault(); e.stopPropagation();
    if (listening) { try{ recRef.current && recRef.current.stop(); }catch(err){} setListening(false); return; }
    const rec = new SpeechRecognitionAPI();
    rec.lang = lang;
    rec.continuous = true;
    rec.interimResults = false;
    rec.onresult = (ev) => {
      let text = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) text += ev.results[i][0].transcript;
      }
      if (text) onAppend(text);
    };
    rec.onend   = () => setListening(false);
    rec.onerror = () => setListening(false);
    recRef.current = rec;
    try { rec.start(); setListening(true); } catch(err) { setListening(false); }
  }

  return (
    <button type="button" onClick={toggle} title={listening?'停止語音輸入':'語音輸入（繁體中文）'}
      className={`mic-btn${listening?' listening':''}`}>
      🎤
    </button>
  );
}

/* Drop-in replacement for <input>/<textarea> that appends voice-recognized text
   without overwriting what's already typed. */
function VoiceField({ as='input', value, onChange, style, ...rest }) {
  function appendText(t) {
    const cur = value || '';
    onChange(cur + t);
  }
  const Tag = as;
  return (
    <div className="voice-field-row">
      <Tag value={value} onChange={e=>onChange(e.target.value)} style={style} {...rest} />
      <MicButton onAppend={appendText} />
    </div>
  );
}

/* ════════════════════════════════════════════════════════
   DEM — EditDialog (enhanced with image, updates, support)
════════════════════════════════════════════════════════ */
function EditDialog({ node, layer, onSave, onDelete, onClose, support, onSupportChange }) {
  const [title, setTitle]   = useState(node.title);
  const [desc, setDesc]     = useState(node.desc||'');
  const [image, setImage]   = useState(node.image||null);
  const [owner, setOwner]   = useState(node.owner||node.assignee||'us');
  const [updates, setUpdates] = useState(node.updates||[]);
  const [updateText, setUpdateText] = useState('');
  const [neededText, setNeededText] = useState('');
  const [receivedText, setReceivedText] = useState('');
  const isSubitem = layer==='subitems'; // Subitem petals (depth-2 leaf nodes): just a title + delete, nothing else applies.
  const [tab, setTab] = useState('basic'); // basic | image | updates | support
  const titleRef = useRef();
  const sup = support[node.id] || { needed:[], received:[] };

  useEffect(() => { titleRef.current?.focus(); titleRef.current?.select(); }, []);

  function handleSave() {
    if (!title.trim()) return;
    if (isSubitem) { onSave({ ...node, title:title.trim() }); onClose(); return; }
    onSave({ ...node, title:title.trim(), desc:desc.trim(), image, updates, owner, assignee: node.assignee!==undefined ? owner : undefined });
    onClose();
  }
  function handleDelete() {
    if (window.confirm(`確定要刪除「${node.title}」嗎？`)) { onDelete(node.id); onClose(); }
  }
  function addUpdate() {
    if (!updateText.trim()) return;
    const entry = { date:todayKey(), text:updateText.trim() };
    setUpdates(prev=>[entry,...prev]); setUpdateText('');
  }
  function addNeeded() {
    if (!neededText.trim()) return;
    const newSup = { ...sup, needed:[...sup.needed, neededText.trim()] };
    onSupportChange(node.id, newSup); setNeededText('');
  }
  function addReceived() {
    if (!receivedText.trim()) return;
    const newSup = { ...sup, received:[...sup.received, receivedText.trim()] };
    onSupportChange(node.id, newSup); setReceivedText('');
  }

  const tabStyle = (t) => ({
    background:'none', border:'none', cursor:'pointer', fontSize:12,
    padding:'6px 12px', borderRadius:8, fontFamily:'inherit',
    color: tab===t ? '#2D4A3E' : '#A09688',
    background: tab===t ? 'rgba(45,74,62,.08)' : 'none',
    fontWeight: tab===t ? 500 : 400,
  });

  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,zIndex:200,background:'rgba(45,40,35,.25)',backdropFilter:'blur(6px)',display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:'#FDFAF5',borderRadius:20,width:'100%',maxWidth:420,maxHeight:'85vh',overflow:'hidden',display:'flex',flexDirection:'column',boxShadow:'0 20px 60px rgba(45,40,35,.14)',animation:'dialogIn .22s cubic-bezier(.22,1,.36,1) both'}}>
        {/* Tabs */}
        <div style={{display:'flex',gap:4,padding:'14px 16px 0',borderBottom:'1px solid #EDE8E0',flexShrink:0}}>
          <button style={tabStyle('basic')} onClick={()=>setTab('basic')}>基本</button>
          {!isSubitem && <button style={tabStyle('image')} onClick={()=>setTab('image')}>圖片</button>}
          {!isSubitem && <button style={tabStyle('updates')} onClick={()=>setTab('updates')}>更新 {updates.length>0?`(${updates.length})`:''}</button>}
          {!isSubitem && <button style={tabStyle('support')} onClick={()=>setTab('support')}>支持</button>}
        </div>

        {/* Content */}
        <div style={{overflowY:'auto',padding:'18px 20px',flex:1}}>
          {tab==='basic' && (
            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              <div>
                <label style={{display:'block',fontSize:10,color:'#A09688',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:5}}>{isSubitem?'細項名稱':'標題'}</label>
                <div className="voice-field-row">
                  <input ref={titleRef} value={title} onChange={e=>setTitle(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSave()} placeholder="節點名稱…" />
                  <MicButton onAppend={t=>setTitle(v=>v+t)} />
                </div>
              </div>
              {/* Show owner for domain / project nodes (layer passed via editTarget) */}
              {layer==='projects' && (
                <div>
                  <label style={{display:'block',fontSize:10,color:'#A09688',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:5}}>負責人</label>
                  <select value={owner} onChange={e=>setOwner(e.target.value)} style={{fontSize:13,padding:'9px 12px',borderRadius:10,border:'1.5px solid #E0D9CF',background:'#FFF',width:'100%',fontFamily:'inherit'}}>
                    <option value="apple">🍎 蘋果派</option>
                    <option value="pine">🌲 松果</option>
                    <option value="us">🤝 我們（共同）</option>
                  </select>
                </div>
              )}
              {!isSubitem && (
                <div>
                  <label style={{display:'block',fontSize:10,color:'#A09688',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:5}}>描述</label>
                  <VoiceField as="textarea" value={desc} onChange={setDesc} placeholder="這個節點的意義…" rows={3} />
                </div>
              )}
            </div>
          )}
          {tab==='image' && !isSubitem && (
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <p style={{fontSize:12,color:'#A09688'}}>上傳一張代表這個節點的照片或願景圖</p>
              <ImageUploadField value={image} onChange={setImage} />
            </div>
          )}
          {tab==='updates' && !isSubitem && (
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              <div style={{display:'flex',gap:8}}>
                <input value={updateText} onChange={e=>setUpdateText(e.target.value)} placeholder="記錄一個新進展…" style={{flex:1}} onKeyDown={e=>e.key==='Enter'&&addUpdate()} />
                <MicButton onAppend={t=>setUpdateText(v=>v+t)} />
                <button onClick={addUpdate} className="btn-primary" style={{padding:'9px 14px',flexShrink:0}}>加入</button>
              </div>
              {updates.length===0 && <p style={{fontSize:12,color:'#C0B8AE',textAlign:'center',padding:'20px 0'}}>還沒有更新紀錄</p>}
              {updates.map((u,i)=>(
                <div key={i} style={{display:'flex',gap:8,borderBottom:'1px solid #EDE8E0',paddingBottom:8}}>
                  <span style={{fontSize:11,color:'#C0B8AE',flexShrink:0,marginTop:1}}>{u.date}</span>
                  <span style={{fontSize:13,color:'#3D3830',lineHeight:1.5}}>{u.text}</span>
                </div>
              ))}
            </div>
          )}
          {tab==='support' && !isSubitem && (
            <div style={{display:'flex',flexDirection:'column',gap:16}}>
              <div>
                <p style={{fontSize:11,color:'#A09688',marginBottom:8,letterSpacing:'.04em'}}>我希望伴侶如何支持我</p>
                <div style={{display:'flex',gap:8,marginBottom:8}}>
                  <input value={neededText} onChange={e=>setNeededText(e.target.value)} placeholder="例如：陪我討論、給我回饋…" style={{flex:1}} onKeyDown={e=>e.key==='Enter'&&addNeeded()} />
                  <MicButton onAppend={t=>setNeededText(v=>v+t)} />
                  <button onClick={addNeeded} className="btn-primary" style={{padding:'9px 14px',flexShrink:0}}>加入</button>
                </div>
                {sup.needed.length===0 && <p style={{fontSize:11,color:'#C0B8AE'}}>尚未填寫</p>}
                {sup.needed.map((n,i)=><p key={i} style={{fontSize:12,color:'#3D3830',padding:'5px 0',borderBottom:'1px solid #F0EDE8'}}>· {n}</p>)}
              </div>
              <div>
                <p style={{fontSize:11,color:'#A09688',marginBottom:8,letterSpacing:'.04em'}}>已收到的支持</p>
                <div style={{display:'flex',gap:8,marginBottom:8}}>
                  <input value={receivedText} onChange={e=>setReceivedText(e.target.value)} placeholder="記錄一個收到的支持…" style={{flex:1}} onKeyDown={e=>e.key==='Enter'&&addReceived()} />
                  <MicButton onAppend={t=>setReceivedText(v=>v+t)} />
                  <button onClick={addReceived} className="btn-primary" style={{padding:'9px 14px',flexShrink:0}}>加入</button>
                </div>
                {sup.received.length===0 && <p style={{fontSize:11,color:'#C0B8AE'}}>尚未紀錄</p>}
                {sup.received.map((n,i)=>(
                  <p key={i} style={{fontSize:12,color:'#2D4A3E',padding:'5px 0',borderBottom:'1px solid #F0EDE8'}}>✓ {n}</p>
                ))}
              </div>
            </div>
          )}
        </div>

        {/* Footer */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 20px',borderTop:'1px solid #EDE8E0',flexShrink:0}}>
          <button onClick={handleDelete} style={{background:'none',border:'none',fontSize:12,color:'#C0887A',fontFamily:'inherit',cursor:'pointer'}}>刪除節點</button>
          <div style={{display:'flex',gap:8}}>
            <button onClick={onClose} className="btn-ghost" style={{padding:'7px 16px',fontSize:12}}>取消</button>
            <button onClick={handleSave} className="btn-primary" style={{padding:'7px 18px',fontSize:12}}>儲存</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════
   DEM — OrbitNode
════════════════════════════════════════════════════════ */
function OrbitNode({ node, pos, delay, onZoomIn, onEdit, isPlaceholder, reorderable, onOwnerChange, dragIndex, onDragStartNode, onDragOverNode, onDropNode, isDragOver, isDragging, kind, onToggleDone, onToggleFeature }) {
  const [hovered, setHovered] = useState(false);
  const [ownerPickerOpen, setOwnerPickerOpen] = useState(false);
  const pickerRef = useRef(null);

  // Close the owner picker when clicking anywhere outside it
  useEffect(() => {
    if (!ownerPickerOpen) return;
    function handleOutside(e) {
      if (pickerRef.current && !pickerRef.current.contains(e.target)) setOwnerPickerOpen(false);
    }
    document.addEventListener('mousedown', handleOutside);
    document.addEventListener('touchstart', handleOutside);
    return () => {
      document.removeEventListener('mousedown', handleOutside);
      document.removeEventListener('touchstart', handleOutside);
    };
  }, [ownerPickerOpen]);

  const OC = {
    apple:{ border:'rgba(232,149,109,.55)', bg:'rgba(232,149,109,.09)', accent:'#E8956D', glow:'rgba(232,149,109,.22)' },
    pine: { border:'rgba(45,74,62,.5)',     bg:'rgba(45,74,62,.08)',    accent:'#2D4A3E', glow:'rgba(45,74,62,.20)'    },
    us:   { border:'rgba(139,123,175,.5)',  bg:'rgba(139,123,175,.08)', accent:'#8B7BAF', glow:'rgba(139,123,175,.20)' },
    done: { border:'rgba(91,163,123,.6)',   bg:'rgba(91,163,123,.14)',  accent:'#5BA37B', glow:'rgba(91,163,123,.25)'  },
  };
  const isSubitem     = kind==='subitem';
  const isAction      = kind==='action';
  const isProject     = kind==='project';
  const isSubitemDone = isSubitem && !!node?.done;
  const isProjectDone = isProject && node?.status==='done';
  const isDoneVisual  = isSubitemDone || isProjectDone;
  const isFeatured    = isSubitem && !!node?.monthlyFocus;
  const nodeOwner = node?._owner || node?.owner || node?.assignee || 'us';
  const oc  = isDoneVisual ? OC.done : (OC[nodeOwner] || OC.us);
  const pct = (node?._actCount > 0) ? Math.round((node?._actDone||0) / node._actCount * 100) : null;
  const OUTER = 118, INNER = 104, r = (OUTER - 8) / 2;
  const circ  = 2 * Math.PI * r;
  const ownerEmoji = nodeOwner==='apple'?'🍎':nodeOwner==='pine'?'🌲':'🤝';
  // Subitems only ever belong to 蘋果派 or 松果 — no shared "us" option at this level.
  const ownerOptions = isSubitem
    ? [{k:'apple',e:'🍎',l:'蘋果派'},{k:'pine',e:'🌲',l:'松果'}]
    : [{k:'apple',e:'🍎',l:'蘋果派'},{k:'pine',e:'🌲',l:'松果'},{k:'us',e:'💜',l:'我們'}];

  if (isPlaceholder) {
    return (
      <div className="node-orbit" style={{left:`${pos.x}%`,top:`${pos.y}%`,animationDelay:`${delay}ms`}}
        onDragOver={reorderable?e=>{e.preventDefault();onDragOverNode&&onDragOverNode(dragIndex);}:undefined}
        onDrop={reorderable?e=>{e.preventDefault();onDropNode&&onDropNode(dragIndex);}:undefined}>
        <div onClick={onZoomIn} onMouseEnter={()=>setHovered(true)} onMouseLeave={()=>setHovered(false)}
          style={{width:90,height:90,borderRadius:'50%',border:`2px dashed ${hovered?'#2D4A3E':'#C8C0B4'}`,background:hovered?'rgba(45,74,62,.04)':'transparent',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',transition:'all .2s'}}>
          <span style={{fontSize:22,color:hovered?'#2D4A3E':'#C8C0B4'}}>＋</span>
        </div>
      </div>
    );
  }

  // Subitem petals are leaves — clicking the circle toggles done instead of navigating deeper.
  const mainClick = isSubitem ? (e=>{e.stopPropagation(); onToggleDone&&onToggleDone(!node.done);}) : onZoomIn;

  return (
    <div className="node-orbit" style={{left:`${pos.x}%`,top:`${pos.y}%`,animationDelay:`${delay}ms`,opacity:isDragging?.35:1}}
      onMouseEnter={()=>setHovered(true)} onMouseLeave={()=>setHovered(false)}
      draggable={reorderable}
      onDragStart={reorderable?e=>{e.stopPropagation();onDragStartNode&&onDragStartNode(dragIndex);}:undefined}
      onDragOver={reorderable?e=>{e.preventDefault();e.stopPropagation();onDragOverNode&&onDragOverNode(dragIndex);}:undefined}
      onDrop={reorderable?e=>{e.preventDefault();e.stopPropagation();onDropNode&&onDropNode(dragIndex);}:undefined}
      onDragEnd={reorderable?()=>onDropNode&&onDropNode(null):undefined}
    >
      <div style={{position:'relative',width:OUTER,height:OUTER,
        outline:isDragOver?'2px dashed #2D4A3E':'none', outlineOffset:4, borderRadius:'50%'}}>

        {/* Progress ring */}
        {pct !== null && (
          <svg width={OUTER} height={OUTER}
            style={{position:'absolute',top:0,left:0,transform:'rotate(-90deg)',pointerEvents:'none',zIndex:1}}>
            <circle cx={OUTER/2} cy={OUTER/2} r={r} fill="none" stroke="rgba(180,172,160,.18)" strokeWidth={3.5}/>
            <circle cx={OUTER/2} cy={OUTER/2} r={r} fill="none" stroke={oc.accent} strokeWidth={3.5}
              strokeDasharray={`${pct/100*circ} ${circ}`} strokeLinecap="round"
              opacity={hovered?0.95:0.6} style={{transition:'opacity .3s'}}/>
          </svg>
        )}

        {/* Edit button */}
        <div onClick={e=>{e.stopPropagation();onEdit();}}
          style={{position:'absolute',top:6,right:6,width:20,height:20,borderRadius:'50%',
            background:hovered?oc.accent:'transparent',display:'flex',alignItems:'center',
            justifyContent:'center',cursor:'pointer',opacity:hovered?1:0,
            transition:'all .15s',zIndex:3,fontSize:10,color:'#F8F6F1'}}>
          ✎
        </div>

        {/* Drag handle hint (only for reorderable Life Domain level) */}
        {reorderable && (
          <div style={{position:'absolute',top:6,left:6,width:20,height:20,borderRadius:'50%',
            background:hovered?'rgba(45,40,35,.35)':'transparent',display:'flex',alignItems:'center',
            justifyContent:'center',opacity:hovered?1:0,transition:'all .15s',zIndex:3,fontSize:11,
            color:'#F8F6F1',cursor:'grab'}} title="拖曳排序">
            ⠿
          </div>
        )}

        {/* 本月執行重點 star toggle — Subitem layer only */}
        {isSubitem && (
          <div onClick={e=>{e.stopPropagation();onToggleFeature&&onToggleFeature(!node.monthlyFocus);}}
            title={isFeatured?'取消本月執行重點':'設為本月執行重點'}
            style={{position:'absolute',bottom:4,left:'50%',transform:'translateX(-50%)',width:22,height:22,borderRadius:'50%',
              background: isFeatured ? '#E8B54D' : (hovered?'rgba(45,40,35,.12)':'transparent'),
              display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',
              opacity: isFeatured||hovered?1:0, transition:'all .15s',zIndex:3,fontSize:11,
              color: isFeatured?'#FFF':'#A09688'}}>
            {isFeatured?'⭐':'☆'}
          </div>
        )}

        {/* 專案達標 toggle — Project layer only */}
        {isProject && (
          <div onClick={e=>{e.stopPropagation();onToggleAchieved&&onToggleAchieved(!isProjectDone);}}
            title={isProjectDone?'取消達標':'標記為已達標'}
            style={{position:'absolute',bottom:4,left:'50%',transform:'translateX(-50%)',width:22,height:22,borderRadius:'50%',
              background: isProjectDone ? '#5BA37B' : (hovered?'rgba(45,40,35,.12)':'transparent'),
              display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',
              opacity: isProjectDone||hovered?1:0, transition:'all .15s',zIndex:3,fontSize:11,
              color: isProjectDone?'#FFF':'#A09688'}}>
            {isProjectDone?'✓':'○'}
          </div>
        )}

        {/* Main circle */}
        <div onClick={mainClick} title={isSubitem?(node.done?'點擊標示未完成':'點擊標示完成'):undefined}
          style={{
            position:'absolute', top:(OUTER-INNER)/2, left:(OUTER-INNER)/2,
            width:INNER, height:INNER, borderRadius:'50%',
            background: hovered ? 'rgba(255,255,255,.96)' : oc.bg,
            border:`1.5px solid ${hovered ? oc.border : (isDoneVisual?oc.border:'rgba(180,172,160,.28)')}`,
            backdropFilter:'blur(10px)',
            display:'flex',alignItems:'center',justifyContent:'center',
            flexDirection:'column',gap:2,
            cursor:'pointer',
            transition:'all .2s cubic-bezier(.22,1,.36,1)',
            transform: hovered ? 'scale(1.07)' : 'scale(1)',
            boxShadow: hovered ? `0 8px 24px ${oc.glow}` : '0 2px 10px rgba(0,0,0,.05)',
            overflow:'hidden', zIndex:2,
          }}
        >
          {/* Image overlay */}
          {node.image && (
            <div style={{position:'absolute',inset:0,borderRadius:'50%',overflow:'hidden',opacity:hovered?.50:.28,transition:'opacity .2s'}}>
              <img src={node.image} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}} onError={()=>{}}/>
            </div>
          )}

          {/* Owner emoji — clickable to change owner (apple/pine[/us]) directly when onOwnerChange is provided.
              Subitem petals & achieved Projects show completion via the circle's own color + strikethrough (see above), not a separate icon. */}
          <span
            onClick={onOwnerChange ? (e=>{e.stopPropagation();setOwnerPickerOpen(o=>!o);}) : undefined}
            style={{fontSize:13,position:'relative',lineHeight:1,transition:'transform .2s',transform:hovered?'scale(1.15)':'scale(1)',cursor:onOwnerChange?'pointer':'default'}}
            title={onOwnerChange?'點擊修改負責人':undefined}>
            {ownerEmoji}
          </span>

          {/* Title */}
          <span style={{
            fontSize: node.title.length>8 ? 10 : 11,
            fontWeight:500,
            color: hovered ? oc.accent : (isDoneVisual ? oc.accent : '#3D3830'),
            textAlign:'center',lineHeight:1.4,
            padding:'0 7px',position:'relative',
            textDecoration: isDoneVisual ? 'line-through' : 'none',
            transition:'color .18s',
          }}>
            {node.title}
          </span>


          {/* Counts + progress % (Project / Action layers only) */}
          {(node._projCount!==undefined || node._actCount!==undefined) && (
            <span style={{fontSize:8,color:hovered?oc.accent:'#A09688',position:'relative',textAlign:'center',lineHeight:1.6,transition:'color .18s'}}>
              {node._projCount!==undefined && <span>{node._projCount}P</span>}
              {node._projCount!==undefined && node._actCount!==undefined && <span style={{margin:'0 2px'}}>·</span>}
              {node._actCount!==undefined && <span>{node._actCount}A</span>}
              {pct!==null && (
                <span style={{marginLeft:3,color:pct>=70?'#2D4A3E':pct>=40?'#C07040':'#A09688',fontWeight:500}}>
                  {pct}%
                </span>
              )}
            </span>
          )}
        </div>

        {/* Owner picker popover */}
        {ownerPickerOpen && (
          <div ref={pickerRef} onClick={e=>e.stopPropagation()}
            style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',
              background:'#FDFAF5',border:'1px solid #E0D9CF',borderRadius:12,padding:'6px',
              boxShadow:'0 8px 24px rgba(45,40,35,.25)',zIndex:999,display:'flex',flexDirection:'column',gap:2,minWidth:104}}>
            {ownerOptions.map(o=>(
              <button key={o.k} onClick={()=>{onOwnerChange(o.k);setOwnerPickerOpen(false);}}
                style={{display:'flex',alignItems:'center',gap:6,background:nodeOwner===o.k?'rgba(45,74,62,.08)':'none',
                  border:'none',borderRadius:7,padding:'6px 8px',fontSize:12,cursor:'pointer',fontFamily:'inherit',
                  color:'#2D2820',textAlign:'left'}}>
                <span>{o.e}</span><span>{o.l}</span>
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}


/* ════════════════════════════════════════════════════════
   DEM — DreamExpansionMap
════════════════════════════════════════════════════════ */
function DreamExpansionMap({ data, setData, support, onSupportChange, jumpTo }) {
  const [stack, setStack]          = useState([{id:'dream',title:data.dream.title,depth:0}]);
  const [phase, setPhase]          = useState('idle');
  const [pendingStack, setPending] = useState(null);
  const [animating, setAnimating]  = useState(false);
  const [editTarget, setEditTarget] = useState(null);

  // Jump to a specific project when requested from Home page
  useEffect(()=>{
    if (!jumpTo?.projectId) return;
    const proj = (data.projects||[]).find(p=>p.id===jumpTo.projectId);
    if (!proj) return;
    setStack([
      {id:'dream', title:data.dream.title, depth:0},
      {id:proj.id, title:proj.title,       depth:1},
    ]);
  },[jumpTo]);

  const current    = stack[stack.length-1];
  const depthLabel = ['專案','行動','細項'][current.depth]||'';

  const getList = useCallback((id,depth)=>{
    if(depth===0) return Array.isArray(data.projects)?data.projects:[];  // guard: flat array only
    if(depth===1) return data.actions[id]||[];
    return [];
  },[data]);

  const children = useMemo(()=>{
    if (current.depth===0) {
      const list = getList(current.id, 0);
      // Projects: enrich with action count + done count
      return list.map(proj=>{
        const acts   = data.actions[proj.id]||[];
        const actDone= acts.filter(a=>a.status==='done').length;
        return {...proj, _actCount:acts.length, _actDone:actDone, _owner:proj.owner||'us'};
      });
    }
    if (current.depth===1) {
      // depth 1: actions — just return as-is with owner hint
      const list = getList(current.id, 1);
      return list.map(a=>({...a, _owner:a.assignee||'us'}));
    }
    // depth 2: subitems (petals) of a specific action — found via current.parentId (project) + current.id (action)
    const actions = data.actions[current.parentId] || [];
    const action  = actions.find(a=>a.id===current.id);
    return (action && Array.isArray(action.subitems)) ? action.subitems.filter(s=>s && typeof s.title==='string') : [];
  },[getList, current, data]);
  const maxSlots = current.depth===2 ? 4 : 8;
  const slots = [...children,...Array(Math.max(0,maxSlots-children.length)).fill(null)].slice(0, current.depth===2?4:9);
  const positions = orbitPositions(slots.length);

  const navigate = useCallback((ns)=>{ if(animating) return; setAnimating(true); setPhase('exit'); setPending(ns); },[animating]);
  useEffect(()=>{
    if(phase==='exit'){ const t=setTimeout(()=>{ setStack(pendingStack); setPhase('enter'); },260); return()=>clearTimeout(t); }
    if(phase==='enter'){ const t=setTimeout(()=>{ setPhase('idle'); setAnimating(false); setPending(null); },420); return()=>clearTimeout(t); }
  },[phase,pendingStack]);

  // depth 0 → 1: zoom into a Project to see its Actions. depth 1 → 2: zoom into an Action to see its Subitem petals.
  // depth 2 is the leaf layer — subitem petals don't zoom further (clicking them toggles done instead).
  const zoomIn = useCallback((node)=>{
    if(current.depth>=2) return;
    const nextDepth = current.depth+1;
    const entry = {id:node.id, title:node.title, depth:nextDepth};
    if (nextDepth===2) entry.parentId = current.id; // remember the parent Project id for the Subitem layer
    navigate([...stack, entry]);
  },[stack,current,navigate]);
  const zoomTo = useCallback((idx)=>{ if(idx===stack.length-1) return; navigate(stack.slice(0,idx+1)); },[stack,navigate]);

  const updateNode = useCallback((layer,parentId,updated)=>{
    const stamped = { ...updated, _updatedAt: Date.now() };
    setData(d=>{
      if(layer==='dream')    return{...d,dream:stamped};
      if(layer==='projects') return{...d,projects:(d.projects||[]).map(n=>n.id===stamped.id?stamped:n)};
      if(layer==='actions')  return{...d,actions:{...d.actions,[parentId]:(d.actions[parentId]||[]).map(n=>n.id===stamped.id?stamped:n)}};
      if(layer==='subitems') {
        const projectId = current.parentId, actionId = parentId;
        return {...d, actions:{...d.actions, [projectId]: (d.actions[projectId]||[]).map(a=>a.id===actionId
          ? {...a, subitems:(a.subitems||[]).map(s=>s.id===stamped.id?stamped:s), _updatedAt:Date.now()}
          : a)}};
      }
      return d;
    });
    setStack(s=>s.map(item=>item.id===stamped.id?{...item,title:stamped.title}:item));
  },[setData,current]);

  const deleteNode = useCallback((layer,parentId,id)=>{
    markDeletedForSync(id);
    setData(d=>{
      if(layer==='projects') return{...d,projects:(d.projects||[]).filter(n=>n.id!==id)};
      if(layer==='actions')  return{...d,actions:{...d.actions,[parentId]:(d.actions[parentId]||[]).filter(n=>n.id!==id)}};
      if(layer==='subitems') {
        const projectId = current.parentId, actionId = parentId;
        return {...d, actions:{...d.actions, [projectId]: (d.actions[projectId]||[]).map(a=>a.id===actionId
          ? {...a, subitems:(a.subitems||[]).filter(s=>s.id!==id), _updatedAt:Date.now()}
          : a)}};
      }
      return d;
    });
    setStack(s=>{ const i=s.findIndex(item=>item.id===id); return i>-1?s.slice(0,i):s; });
  },[setData,current]);

  const addNode = useCallback((layer,parentId)=>{
    const n = layer==='actions' ? makeAction('新節點') : layer==='subitems' ? makeSubitem('新細項') : {...makeNode('新節點'),owner:'us',status:'todo'};
    setData(d=>{
      if(layer==='projects') return{...d,projects:[...(d.projects||[]),n]};
      if(layer==='actions')  return{...d,actions:{...d.actions,[parentId]:[...(d.actions[parentId]||[]),n]}};
      if(layer==='subitems') {
        const projectId = current.parentId, actionId = parentId;
        return {...d, actions:{...d.actions, [projectId]: (d.actions[projectId]||[]).map(a=>a.id===actionId
          ? {...a, subitems:[...(a.subitems||[]).filter(s=>s&&typeof s.title==='string'), n].slice(0,4), _updatedAt:Date.now()}
          : a)}};
      }
      return d;
    });
    setTimeout(()=>setEditTarget({node:n,layer,parentId}),50);
  },[setData,current]);

  // ── Drag & drop reordering — Life Domains (depth 0) AND Actions within a project (depth 1) ──
  const [dragIdx, setDragIdx]         = useState(null);
  const [dragOverIdx, setDragOverIdx] = useState(null);
  const reorderProjects = useCallback((fromIdx, toIdx) => {
    if (fromIdx===null || toIdx===null || fromIdx===toIdx) return;
    setData(d => {
      const list = [...(d.projects||[])];
      if (fromIdx<0||fromIdx>=list.length||toIdx<0||toIdx>=list.length) return d;
      const [moved] = list.splice(fromIdx,1);
      list.splice(toIdx,0,moved);
      return {...d, projects:list, projectsOrderAt:Date.now()};
    });
  },[setData]);
  const reorderActions = useCallback((parentId, fromIdx, toIdx) => {
    if (fromIdx===null || toIdx===null || fromIdx===toIdx) return;
    setData(d => {
      const list = [...(d.actions[parentId]||[])];
      if (fromIdx<0||fromIdx>=list.length||toIdx<0||toIdx>=list.length) return d;
      const [moved] = list.splice(fromIdx,1);
      list.splice(toIdx,0,moved);
      return {...d, actions:{...d.actions,[parentId]:list}, actionsOrderAt:{...(d.actionsOrderAt||{}),[parentId]:Date.now()}};
    });
  },[setData]);
  function handleDropNode(toIdx) {
    if (toIdx!==null) {
      if (current.depth===0) reorderProjects(dragIdx, toIdx);
      else if (current.depth===1) reorderActions(current.id, dragIdx, toIdx);
      // depth 2 (subitem petals): no reordering — order isn't meaningful for a 4-slot checklist
    }
    setDragIdx(null); setDragOverIdx(null);
  }

  // ── Change owner directly from the map (Life Domains / Projects level) ──
  const changeProjectOwner = useCallback((projectId, newOwner) => {
    setData(d => ({ ...d, projects: (d.projects||[]).map(p => p.id===projectId ? {...p, owner:newOwner, _updatedAt:Date.now()} : p) }));
  },[setData]);

  // ── Toggle whether a Project is marked as achieved (達標) directly from the map ──
  const toggleProjectAchieved = useCallback((projectId, val) => {
    setData(d => ({ ...d, projects: (d.projects||[]).map(p => p.id===projectId ? {...p, status: val?'done':'todo', _updatedAt:Date.now()} : p) }));
  },[setData]);

  // ── Change owner (assignee) directly from the map at the Action level ──
  const changeActionOwner = useCallback((parentProjectId, actionId, newOwner) => {
    setData(d => ({
      ...d,
      actions: {
        ...d.actions,
        [parentProjectId]: (d.actions[parentProjectId]||[]).map(a => a.id===actionId ? {...a, assignee:newOwner, _updatedAt:Date.now()} : a),
      },
    }));
  },[setData]);

  // ── Toggle a subitem petal's done state directly from the map (Subitem/petal layer) ──
  const toggleActionSubitem = useCallback((parentProjectId, actionId, subitemId, done) => {
    setData(d => ({
      ...d,
      actions: {
        ...d.actions,
        [parentProjectId]: (d.actions[parentProjectId]||[]).map(a => a.id===actionId
          ? { ...a, subitems:(a.subitems||[]).map(s=>s.id===subitemId?{...s,done}:s), _updatedAt:Date.now() }
          : a),
      },
    }));
  },[setData]);

  // ── Change a subitem petal's owner (apple/pine only) directly from the map ──
  const changeSubitemOwner = useCallback((parentProjectId, actionId, subitemId, newOwner) => {
    setData(d => ({
      ...d,
      actions: {
        ...d.actions,
        [parentProjectId]: (d.actions[parentProjectId]||[]).map(a => a.id===actionId
          ? { ...a, subitems:(a.subitems||[]).map(s=>s.id===subitemId?{...s,assignee:newOwner}:s), _updatedAt:Date.now() }
          : a),
      },
    }));
  },[setData]);

  // ── Toggle whether a Subitem is marked as this month's featured focus (used on the Home page) ──
  const toggleSubitemFeature = useCallback((parentProjectId, actionId, subitemId, val) => {
    setData(d => ({
      ...d,
      actions: {
        ...d.actions,
        [parentProjectId]: (d.actions[parentProjectId]||[]).map(a => a.id===actionId
          ? { ...a, subitems:(a.subitems||[]).map(s=>s.id===subitemId?{...s,monthlyFocus:val}:s), _updatedAt:Date.now() }
          : a),
      },
    }));
  },[setData]);

  const currentLayer = current.depth===0?'projects':current.depth===1?'actions':'subitems';

  return (
    <div style={{flex:1,position:'relative',display:'flex',flexDirection:'column',fontFamily:"'Noto Sans TC','PingFang TC',system-ui,sans-serif",overflow:'hidden',userSelect:'none'}}>
      {/* Top breadcrumb */}
      <div style={{padding:'18px 24px 0',display:'flex',alignItems:'center',gap:6,minHeight:44,flexShrink:0}}>
        {stack.map((s,i)=>(
          <span key={s.id+i} style={{display:'flex',alignItems:'center',gap:6}}>
            {i>0&&<span style={{color:'#C8C0B4',fontSize:13}}>›</span>}
            <button onClick={()=>zoomTo(i)} style={{background:'none',border:'none',padding:'2px 4px',cursor:i===stack.length-1?'default':'pointer',fontSize:13,fontFamily:'inherit',color:i===stack.length-1?'#3D3830':'#A09688',fontWeight:i===stack.length-1?500:400,transition:'color .15s'}} onMouseEnter={e=>{if(i<stack.length-1)e.target.style.color='#2D4A3E'}} onMouseLeave={e=>{if(i<stack.length-1)e.target.style.color='#A09688'}}>{s.title}</button>
          </span>
        ))}
        {depthLabel&&<span style={{marginLeft:8,fontSize:10,letterSpacing:'.12em',color:'#A09688',textTransform:'uppercase',padding:'3px 10px',border:'1px solid #DDD8D0',borderRadius:20,background:'rgba(255,255,255,.7)'}}>{depthLabel}</span>}
        <div style={{marginLeft:'auto'}}>
          <button onClick={()=>setEditTarget({node:data.dream,layer:'dream',parentId:null})} style={{background:'none',border:'1.5px solid #E0D9CF',borderRadius:20,padding:'4px 14px',fontSize:11,color:'#A09688',cursor:'pointer',fontFamily:'inherit',letterSpacing:'.06em',transition:'all .15s'}} onMouseEnter={e=>{e.currentTarget.style.borderColor='#2D4A3E';e.currentTarget.style.color='#2D4A3E'}} onMouseLeave={e=>{e.currentTarget.style.borderColor='#E0D9CF';e.currentTarget.style.color='#A09688'}}>編輯夢想</button>
        </div>
      </div>

      {/* Map */}
      <div style={{flex:1,position:'relative'}}>
        <div className={`phase-${phase}`} style={{position:'absolute',inset:0}}>
          <svg className="svg-lines" viewBox="0 0 100 100" preserveAspectRatio="none">
            {slots.map((node,i)=>{
              const pos=positions[i];
              // gentle arc: control point perpendicular offset
              const mx=(50+pos.x)/2+(pos.y-50)*0.12;
              const my=(50+pos.y)/2-(pos.x-50)*0.12;
              const owner=node?._owner||node?.owner||node?.assignee;
              const stroke=node?(owner==='apple'?'rgba(232,149,109,.45)':owner==='pine'?'rgba(45,74,62,.38)':'rgba(139,123,175,.38)'):'rgba(210,205,195,.5)';
              return(
                <path key={i}
                  d={`M 50 50 Q ${mx} ${my} ${pos.x} ${pos.y}`}
                  stroke={stroke} strokeWidth={node?'0.7':'0.35'}
                  fill="none" strokeDasharray={node?'none':'2 6'}
                  opacity={node?0.7:0.3}/>
              );
            })}
          </svg>
          <div className="node-center">
            <div className="dem-breathe" style={{width:148,height:148,borderRadius:'50%',background:'linear-gradient(135deg,#2D4A3E 0%,#3A5F4E 100%)',display:'flex',alignItems:'center',justifyContent:'center',cursor:stack.length>1?'pointer':'default',position:'relative',overflow:'hidden',transition:'transform .2s'}} onClick={()=>stack.length>1&&zoomTo(stack.length-2)}>
              {/* Show dream image subtly in center if available */}
              {stack.length===1&&data.dream.image&&<img src={data.dream.image} alt="" style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',opacity:.15}} onError={()=>{}} />}
              <span style={{fontFamily:"'Noto Serif TC',serif",fontSize:current.title.length>7?12:14,fontWeight:400,color:'#F8F6F1',textAlign:'center',lineHeight:1.7,letterSpacing:'.05em',padding:'0 18px',position:'relative'}}>{current.title}</span>
            </div>
            {stack.length>1&&<div style={{textAlign:'center',marginTop:8,fontSize:10,color:'#C0B8AE',letterSpacing:'.06em'}}>點擊返回</div>}
          </div>
          {slots.map((node,i)=>{const pos=positions[i];return(<OrbitNode key={node?node.id:'empty_'+i} node={node} pos={pos} delay={phase==='enter'?i*25:0} isPlaceholder={!node} onZoomIn={()=>node?zoomIn(node):addNode(currentLayer,current.id)} onEdit={()=>node&&setEditTarget({node,layer:currentLayer,parentId:current.id})}
            reorderable={current.depth<2} dragIndex={i}
            onDragStartNode={setDragIdx} onDragOverNode={setDragOverIdx} onDropNode={handleDropNode}
            isDragOver={dragOverIdx===i && dragIdx!==i} isDragging={dragIdx===i}
            onOwnerChange={node ? (
              current.depth===0 ? (o)=>changeProjectOwner(node.id,o) :
              current.depth===1 ? (o)=>changeActionOwner(current.id,node.id,o) :
              (o)=>changeSubitemOwner(current.parentId,current.id,node.id,o)
            ) : undefined}
            kind={current.depth===0?'project':current.depth===1?'action':'subitem'}
            onToggleDone={node && current.depth===2 ? (done)=>toggleActionSubitem(current.parentId,current.id,node.id,done) : undefined}
            onToggleFeature={node && current.depth===2 ? (val)=>toggleSubitemFeature(current.parentId,current.id,node.id,val) : undefined}
            onToggleAchieved={node && current.depth===0 ? (val)=>toggleProjectAchieved(node.id,val) : undefined}
          />);})}
        </div>
      </div>

      {phase==='idle'&&<div style={{textAlign:'center',padding:'0 0 16px',fontSize:11,color:'#C8C0B4',letterSpacing:'.08em',flexShrink:0}}>{current.depth===2?'點擊花瓣標示完成 · 點下方 ☆ 標記本月執行重點 · 點右上角 ✎ 編輯':current.depth===0?'點擊節點展開 · 點下方 ○ 標記達標 · 點右上角 ✎ 編輯 · 拖曳 ⠿ 排序 · 點選圖示可直接切換負責人':'點擊節點展開 · 點右上角 ✎ 編輯 · 拖曳 ⠿ 排序 · 點選圖示可直接切換負責人'}</div>}

      {editTarget&&(
        <EditDialog node={editTarget.node} layer={editTarget.layer} onSave={u=>updateNode(editTarget.layer,editTarget.parentId,u)} onDelete={id=>deleteNode(editTarget.layer,editTarget.parentId,id)} onClose={()=>setEditTarget(null)} support={support} onSupportChange={onSupportChange} />
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════
   HOME PAGE
════════════════════════════════════════════════════════ */
function HomePage({ demData, calEvents, todayStatus, setTodayStatus, setPage, onJumpProject }) {
  const today   = todayKey();
  const weekEnd = new Date(); weekEnd.setDate(weekEnd.getDate()+7);
  const weekStr = weekEnd.toISOString().slice(0,10);

  const todayEvs    = calEvents.filter(e=>eventSpansDay(e,today));
  const next30End = (()=>{ const d=new Date(); d.setDate(d.getDate()+30); return d.toISOString().slice(0,10); })();
  const next30Evs = calEvents.filter(e=>eventOverlapsRange(e,today,next30End)).sort((a,b)=>eventStart(a).localeCompare(eventStart(b)));
  const upcomingEvs = calEvents.filter(e=>eventOverlapsRange(e,today,weekStr)&&eventStart(e)!==today).sort((a,b)=>eventStart(a).localeCompare(eventStart(b)));

  const allActions = useMemo(()=>{
    const r=[];
    (demData.projects||[]).forEach(proj=>{
      (demData.actions[proj.id]||[]).forEach(a=>{
        r.push({...a,domainTitle:proj.title,projectTitle:proj.title});
      });
    });
    return r;
  },[demData]);

  // 本月執行專案：已勾選「本月執行重點」的細項，依完成狀態分兩組
  const monthlyItems = useMemo(()=>{
    const items = [];
    (demData.projects||[]).forEach(proj=>{
      (demData.actions[proj.id]||[]).forEach(a=>{
        (a.subitems||[]).forEach(s=>{
          if (s && s.monthlyFocus && s.title && s.title.trim()) {
            items.push({
              id:'sub_'+s.id, kind:'subitem', title:s.title.trim(), done:!!s.done,
              projectTitle:proj.title, actionTitle:a.title,

function CalendarPage({ calEvents, setCalEvents }) {

  const [selDay, setSelDay] = useState(null);

  function changeMonth(d) { let m=month+d,y=year; if(m<0){m=11;y--;} if(m>11){m=0;y++;} setMonth(m);setYear(y); }
  const cells = monthGrid(year,month);
  const today = todayKey();

  return (
    <div className="page-scroll">
      <div style={{padding:'20px 28px 40px',maxWidth:720,margin:'0 auto'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:22}}>
          <button onClick={()=>changeMonth(-1)} style={{background:'none',border:'1.5px solid #E0D9CF',borderRadius:9,padding:'6px 12px',cursor:'pointer',color:'#7D7468',fontSize:16}}>‹</button>
          <h2 style={{fontFamily:"'Noto Serif TC',serif",fontSize:18,fontWeight:400,color:'#2D2820'}}>{year} 年 {MONTHS[month]}</h2>
          <button onClick={()=>changeMonth(1)} style={{background:'none',border:'1.5px solid #E0D9CF',borderRadius:9,padding:'6px 12px',cursor:'pointer',color:'#7D7468',fontSize:16}}>›</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',textAlign:'center',marginBottom:6}}>
          {DAYS.map(d=><div key={d} style={{fontSize:11,color:'#A09688',padding:'3px 0'}}>{d}</div>)}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>
          {cells.map((day,i)=>{
            if(!day) return <div key={i}></div>;
            const dk=toKey(year,month,day);
            const evs=calEvents.filter(e=>eventSpansDay(e,dk));
            const isToday=dk===today;
            const hasHigh=evs.some(e=>e.stress==='high');
            return (
              <button key={i} onClick={()=>setSelDay(dk)}
                style={{
                  minHeight:64,borderRadius:9,
                  border:`1.5px solid ${isToday?'#2D4A3E':hasHigh?'rgba(232,124,58,.5)':'rgba(180,172,160,.3)'}`,

                <span style={{fontSize:11,fontWeight:isToday?700:400,color:isToday?'#2D4A3E':'#3D3830',marginBottom:2,width:'100%',textAlign:'center'}}>
                  {day}

                    const em=e.owner==='apple'?'🍎':e.owner==='pine'?'🌲':'🤝';
                    const stress=e.stress==='high'?'🔥':'';
                    return (
                      <span key={e.id} style={{fontSize:9,lineHeight:1.4,color:'#3D3830',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:1}}>
                        <span style={{flexShrink:0}}>{em}{stress}</span>

                      </span>

        <div style={{marginTop:14,padding:'11px 14px',background:'rgba(255,255,255,.65)',borderRadius:11,border:'1px solid rgba(180,172,160,.3)'}}>
          <div style={{display:'flex',flexWrap:'wrap',gap:10,marginBottom:6,alignItems:'center'}}>

      <div style={{display:'flex',gap:8}}>
